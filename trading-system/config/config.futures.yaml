# ============================================================================
#  CONFIGURAÇÃO DE FUTUROS — LONG + SHORT (lucra na alta E na queda)
#  Roda em PARALELO ao spot, em conta de FUTUROS testnet separada.
#  Alavancagem BAIXA e margem ISOLADA: risco controlado, sem 20x suicida.
# ============================================================================
symbols: ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT"]
initial_equity: 10000
testnet: true            # SEMPRE testnet primeiro
market_type: futures     # ativa o mercado de futuros
leverage: 3              # 3x — moderado (backtest: acima de ~10x começa a liquidar)
trading_capital_usd: 2000  # dimensiona as ordens como conta de $2000 (real futuro)

risk:
  # Perfil proporcional a uma conta de $2000 (trading_capital_usd)
  max_risk_per_trade_pct: 2.0      # 2% de $2000 = ~$40 de risco por trade
  max_position_pct: 30.0           # exposição máx ~$600 por posição
  max_open_positions: 4
  max_daily_drawdown_pct: 6.0      # rede de segurança % (o limite em $ age antes)
  max_weekly_drawdown_pct: 12.0
  max_consecutive_losses: 4
  max_trades_per_day: 24            # teto de 24/dia (só se houver oportunidade)
  default_trailing_stop_pct: 8.0
  min_risk_reward_ratio: 1.5
  # Envelope diário em DÓLARES (proporcional a $2000):
  max_daily_loss_usd: 60                  # perdeu $60 (3% de $2000) -> para até amanhã
  # Trava de lucro: ao atingir +$80 (4%), piso $40 (2%) abaixo do pico, que
  # sobe junto com o lucro. Recuou até o piso -> fecha e embolsa. Segue
  # operando enquanto o lucro do dia sobe.
  daily_profit_lock_trigger_usd: 80
  daily_profit_lock_gap_usd: 40

quant:
  mode: "pullback"
  side: "both"                     # LONG na alta + SHORT na baixa
  trend_sma_days: 50
  pullback_rsi: 45.0
  timeframes: ["1m", "5m", "15m", "1h", "1d"]

sentiment:
  poll_interval_seconds: 60
  catastrophic_score_threshold: -0.75
  catastrophic_confidence_threshold: 0.6

execution:
  prefer_limit_orders: true
  limit_offset_bps: 2.0
  limit_timeout_seconds: 20
  max_slippage_bps: 15.0
